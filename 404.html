<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada — Paulo Pimenta</title>
  <meta name="description" content="Página não encontrada no site de Paulo Pimenta." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />

  <script>
    document.documentElement.classList.add("js");
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">PP</span>
        <span class="brand-text">Paulo Pimenta</span>
      </a>
      <div class="nav-actions">
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Ativar tema claro" title="Alternar tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="error-page" id="conteudo">
    <div class="error-inner">
      <p class="eyebrow">Erro 404</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Essa página não existe.</h1>
      <p class="section-intro">Pode ser que o link esteja quebrado ou que a página tenha mudado de lugar. Que tal voltar para o início?</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Voltar ao início</a>
        <a class="btn btn-ghost" href="/#projetos">Ver projetos</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>© <span id="year">2026</span> Paulo Pimenta · Feito com HTML, CSS e curiosidade.</p>
      <a class="back-top" href="/">Início <span aria-hidden="true">↑</span></a>
    </div>
  </footer>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
